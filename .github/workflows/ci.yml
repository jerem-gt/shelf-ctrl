name: Build, Release & Push

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Groupes séparés push / PR : seuls les runs de PR sont annulés (un run push peut être en pleine release)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # CI, Sonar, release, image Docker et ménage : workflow commun à cash-ctrl et shelf-ctrl.
  # Même tag que la devDependency @jerem-gt/ctrl-shared (package.json).
  app:
    uses: jerem-gt/ctrl-shared/.github/workflows/app.yml@d90772dc37474d2320d6564f53719b889ea16169 # v1.5.0
    # Maximum accordé au workflow commun ; chacun de ses jobs n'en demande qu'une partie
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    secrets: inherit
