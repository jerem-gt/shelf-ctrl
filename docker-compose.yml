# Stack Portainer dédiée, lue telle quelle depuis GitHub : toute variable ajoutée ici se crée d'abord dans la stack.
# Indépendante de cash-ctrl (réseau propre au projet).
services:
  shelfctrl:
    image: ghcr.io/jerem-gt/shelf-ctrl:latest
    user: '${PUID}:${PGID}'
    container_name: shelf-ctrl
    labels:
      # Pour watchtower-fast
      - 'com.centurylinklabs.watchtower.scope=app-fast'
    restart: unless-stopped
    ports:
      - '3101:3101'
    volumes:
      - /volume1/data/shelf-ctrl:/data
    environment:
      - NODE_ENV=production
      - PORT=3101
      - DATA_DIR=/data
      - SESSION_SECRET=${SESSION_SECRET}
      - SECURE_COOKIE=true
      - LOG_LEVEL=INFO
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # E-mails « mot de passe oublié » : variables de la stack, facultatives (sans SMTP, le lien est dans les logs)
      - APP_URL=${APP_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    networks:
      mynet:
        ipv4_address: 172.27.0.2
  shelfctrl-dev:
    image: ghcr.io/jerem-gt/shelf-ctrl:dev
    user: '${PUID}:${PGID}'
    container_name: shelf-ctrl-dev
    labels:
      - 'com.centurylinklabs.watchtower.scope=app-fast'
    restart: unless-stopped
    ports:
      - '4101:4101'
    volumes:
      - /volume1/data/shelf-ctrl-dev:/data
    environment:
      - NODE_ENV=production
      - PORT=4101
      - DATA_DIR=/data
      # Secret distinct de la prod : les cookies ne sont pas isolés par port sur le même hôte
      - SESSION_SECRET=${SESSION_SECRET_DEV}
      - SECURE_COOKIE=true
      - LOG_LEVEL=INFO
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # Même SMTP que la prod, seule l'URL publique change
      - APP_URL=${APP_URL_DEV:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    networks:
      mynet:
        ipv4_address: 172.27.0.3
networks:
  mynet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/24
          gateway: 172.27.0.1
